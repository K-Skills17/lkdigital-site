<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Scripts de WhatsApp para a recepção — LK Digital</title>
<!-- Print layout for dist/scripts-whatsapp.pdf: an A5 booklet layout scaled ×1.414 onto A4 pages
     ("A5-friendly layout on A4": prints on A4, and still reads well printed 2-up on A5). -->
<style>
/*@font-inter*/
/*@brand*/
@page{size:A4;margin:17mm 15.5mm 20mm}
html{zoom:1.4142}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font-family:var(--lk-font);color:#161616;font-size:8.8pt;line-height:1.42}
.page{break-after:page}
.newpage{break-before:page}
.kicker{margin:0 0 6px;color:var(--lk-accent-text);font-weight:800;font-size:7.5pt;letter-spacing:.1em;text-transform:uppercase}
h1{font-family:var(--lk-font-heading);font-size:25pt;line-height:1.05;font-weight:700;margin:0 0 10px;border-left:5px solid var(--lk-accent);padding-left:10px}
.cover{padding-top:18mm}
.sub{font-size:11pt;font-weight:600;margin:0 0 18px;color:#333}
.toc{margin:0;padding-left:18px;color:#444}
.toc li{margin-bottom:3px}
h2{font-family:var(--lk-font-heading);font-size:16pt;font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:7px;break-after:avoid}
.sec{margin-bottom:10px}
.sec h2{border-bottom:2px solid var(--lk-accent);padding-bottom:4px}
.n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--lk-accent);color:var(--ink);font-family:var(--lk-font);font-size:8pt;flex:none}
h3{font-size:9.8pt;font-weight:800;margin:10px 0 5px;break-after:avoid}
.intro{color:#444;margin:0 0 8px}
.sc{break-inside:avoid;margin:0 0 7px}
.keep{break-inside:avoid}
.st{margin:0 0 2px;font-weight:800;font-size:7.5pt;text-transform:uppercase;letter-spacing:.05em;color:#666}
.bb{background:#E7F7DC;border-radius:2px 10px 10px 10px;padding:6px 9px;border:1px solid #CBE8B8}
.bb.audio{background:#F1F1F1;border-color:#DDD}
.ph{background:#FFF2CC;border-radius:3px;padding:0 2px;font-weight:600;color:#6B4E00}
.nota{margin:0 0 5px;padding:4px 8px;border-left:3px solid var(--lk-warn);background:#FFF7E0;font-size:8pt}
.quando{margin:0 0 8px;padding-left:16px}
.quando li{margin-bottom:2px}
.keys{border-collapse:collapse;width:100%;margin:6px 0 10px}
.keys th,.keys td{text-align:left;padding:3px 6px;border-bottom:.5px solid #ccc}
.keys th{background:#161616;color:#fff;font-weight:600}
.rules{padding-top:4mm}
ol.big{list-style:none;counter-reset:r;padding:0;margin:8px 0 0}
ol.big li{counter-increment:r;position:relative;padding:0 0 12px 34px}
ol.big li::before{content:counter(r);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--lk-accent);color:var(--ink);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:10pt}
ol.big b{display:block;font-size:11pt;margin-bottom:2px}
ol.big span{color:#444}
.pipe{display:flex;flex-wrap:wrap;align-items:stretch;gap:4px;margin:6px 0 8px}
.stage{flex:1 1 28%;border:1.5px solid #161616;border-radius:6px;padding:5px 6px;break-inside:avoid}
.stage b{display:block;font-size:9pt}
.stage .sla{display:inline-block;background:#F6EEDC;color:var(--ink);border:1px solid var(--lk-accent);border-radius:3px;padding:0 4px;font-size:7pt;font-weight:700;margin:2px 0}
.stage small{display:block;color:#555;font-size:7.3pt}
.arrow{align-self:center;font-weight:800;color:var(--lk-accent-text)}
.stage.lost{border-style:dashed;border-color:#999}
.close{margin:14px 0 0;padding:8px 10px;background:#161616;color:#fff;border-radius:6px;font-weight:600}
</style>
</head>
<body>
<!--@render:scripts-whatsapp#booklet-->
</body>
</html>
