<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Checklist do Perfil da Empresa no Google — LK Digital</title>
<!-- Print layout for dist/checklist-gbp.pdf (A4). Light background so it prints cheaply. -->
<style>
/*@font-inter*/
/*@brand*/
@page{size:A4;margin:14mm 15mm 16mm}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font-family:var(--lk-font);color:#161616;font-size:9.6pt;line-height:1.42}
.page{break-after:page}
.page:last-child{break-after:auto}
.kicker{margin:0 0 6px;color:var(--lk-accent-text);font-weight:800;font-size:8pt;letter-spacing:.1em;text-transform:uppercase}
h1{font-family:var(--lk-font-heading);font-size:30pt;line-height:1.05;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
.sub{font-size:12pt;font-weight:600;margin:0 0 14px}
.lead{font-size:10.5pt;color:#444;margin:0 0 16px}
.box{border:1.5px solid #161616;border-radius:8px;padding:10px 14px;margin:0 0 14px}
.box h3,.toc h3{margin:0 0 6px;font-size:10.5pt;font-weight:800}
.box ol{margin:0;padding-left:18px}
.score{background:#161616;color:#fff;border-radius:8px;padding:12px 14px;font-weight:700;font-size:11pt;margin:0 0 16px}
.blank{display:inline-block;width:46px;border-bottom:1.5px solid #fff;margin:0 4px}
.toc ol{margin:0;padding-left:18px;columns:2;column-gap:24px}
.toc li{margin-bottom:4px;break-inside:avoid}
.toc li span{color:#777;font-size:8.5pt}
.cover{padding-top:10mm}
.cover h1{border-left:6px solid var(--lk-accent);padding-left:12px}
.sec{margin:0 0 10px}
.sec h2{display:flex;align-items:center;gap:8px;font-family:var(--lk-font-heading);font-size:16pt;font-weight:700;margin:0 0 4px;padding-bottom:4px;border-bottom:2px solid var(--lk-accent);break-after:avoid}
.n{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;border:1.5px solid var(--lk-accent);color:var(--ink);font-family:var(--lk-font);font-size:8.5pt;flex:none}
.item{display:flex;gap:9px;padding:5px 0;border-bottom:.5px solid #ddd;break-inside:avoid}
.cb{flex:none;width:13px;height:13px;border:1.5px solid #161616;border-radius:2px;margin-top:2px}
.item p{margin:0;color:#444;font-size:8.8pt}
.item p b{color:#161616}
.item .t{color:#161616;font-weight:700;font-size:9.8pt;margin-bottom:1px}
.nota{margin:6px 0 0;padding:6px 9px;border-left:3px solid var(--lk-warn);background:#FFF7E0;font-size:8.5pt;break-inside:avoid}
h2.big{font-family:var(--lk-font-heading);font-size:24pt;font-weight:700;margin:0 0 6px}
.kit h3{font-size:11pt;font-weight:800;margin:14px 0 6px;break-after:avoid}
.steps{margin:0;padding-left:18px}
.steps li{margin-bottom:2px}
.rules{margin:0 0 8px;padding-left:16px}
.rules li{margin-bottom:2px}
.ph{color:var(--lk-accent-text);font-weight:600}
.tpl{border:1px solid #ccc;border-radius:6px;padding:7px 10px;margin:0 0 7px;break-inside:avoid}
.tpl .q{margin:0 0 3px;font-weight:800;font-size:8.5pt;text-transform:uppercase;letter-spacing:.05em;color:var(--lk-accent-text)}
.tpl .tx{margin:0}
table{width:100%;border-collapse:collapse;font-size:8.8pt;margin-top:4px}
th,td{text-align:left;padding:5px 6px;border-bottom:.5px solid #ccc;vertical-align:top}
th{background:#161616;color:#fff;font-weight:600}
.copy .small{font-size:8.5pt;color:#444;margin:0 0 10px}
.cp{border:1px dashed #999;border-radius:6px;padding:6px 10px;margin:0 0 7px;break-inside:avoid}
.cp .q{margin:0 0 2px;font-weight:800;font-size:8pt;text-transform:uppercase;letter-spacing:.05em;color:#777}
.cp pre{margin:0;white-space:pre-wrap;font-family:var(--lk-font);font-size:9pt;line-height:1.4}
.close{margin:12px 0 0;padding:9px 12px;background:#161616;color:#fff;border-radius:6px;font-weight:600;font-size:9pt}
</style>
</head>
<body>
<!--@render:checklist-google#print-->
</body>
</html>
