<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cola rápida da recepção — LK Digital</title>
<!-- Print layout for dist/cola-rapida.pdf: one A4 page for the reception desk. -->
<style>
/*@font-inter*/
/*@brand*/
@page{size:A4;margin:10mm 11mm}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font-family:var(--lk-font);color:#161616;font-size:10.2pt;line-height:1.38}
.kicker{margin:0 0 3px;color:var(--lk-accent-text);font-weight:800;font-size:7.5pt;letter-spacing:.1em;text-transform:uppercase}
h1{font-family:var(--lk-font-heading);font-size:26pt;font-weight:700;margin:0 0 8px;border-left:5px solid var(--lk-accent);padding-left:9px;line-height:1.1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
h2{font-family:var(--lk-font-heading);font-size:15pt;font-weight:700;margin:12px 0 5px;padding-bottom:2px;border-bottom:1.5px solid var(--lk-accent)}
.cols>div>h2:first-child{margin-top:0}
ol,ul{margin:0;padding-left:15px}
li{margin-bottom:3px}
.rules b{display:inline}
.tip{margin:4px 0 0;color:#444}
.bb{background:#E7F7DC;border-radius:2px 9px 9px 9px;padding:6px 8px;border:1px solid #CBE8B8}
.ph{background:#FFF2CC;border-radius:3px;padding:0 2px;font-weight:600;color:#6B4E00}
table{width:100%;border-collapse:collapse}
td{padding:3px 4px;border-bottom:.5px solid #ccc;vertical-align:top}
td:first-child{font-weight:700;width:38%}
.obj li{margin-bottom:4px}
.pipe{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-bottom:4px}
.stage{border:1.5px solid #161616;border-radius:5px;padding:3px 5px}
.stage b{display:block;font-size:10pt}
.stage .sla{display:inline-block;background:#F6EEDC;color:var(--ink);border:1px solid var(--lk-accent);border-radius:3px;padding:0 3px;font-size:8pt;font-weight:700}
.stage small{display:block;font-size:8.2pt;color:#555}
.arrow{font-weight:800;color:var(--lk-accent-text)}
.stage.lost{border-style:dashed;border-color:#999}
footer{margin-top:10px;font-size:8.4pt;color:#555;border-top:.5px solid #ccc;padding-top:4px}
</style>
</head>
<body>
<!--@render:scripts-whatsapp#cola-->
</body>
</html>
