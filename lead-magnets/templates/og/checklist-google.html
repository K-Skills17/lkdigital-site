<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- OG image template (1200x630) for the checklist page. -->
<style>
/*@font-inter*/
/*@brand*/
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:var(--lk-bg);color:var(--lk-text);font-family:var(--lk-font);display:flex;flex-direction:column;justify-content:center;padding:0 90px;box-sizing:border-box;position:relative}
.bar{position:absolute;left:0;top:0;bottom:0;width:18px;background:var(--lk-accent)}
.k{color:var(--lk-accent-text);font-weight:800;font-size:26px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 22px}
h1{font-family:var(--lk-font-heading);font-size:88px;line-height:1;font-weight:700;margin:0 0 28px}
p{font-size:30px;color:var(--lk-muted);margin:0;font-weight:600}
.brand{position:absolute;right:90px;bottom:54px;font-family:var(--lk-font-heading);font-weight:700;font-size:34px}
.checks{position:absolute;right:90px;top:70px;display:flex;flex-direction:column;gap:14px}
.checks span{width:44px;height:44px;border-radius:9px;background:var(--lk-accent);display:block}
.checks span:nth-child(3){background:transparent;border:4px solid var(--lk-muted);box-sizing:border-box}
</style>
</head>
<body>
<div class="bar"></div>
<div class="checks"><span></span><span></span><span></span></div>
<p class="k">Checklist gratuito</p>
<h1>Perfil do Google<br>da clínica odontológica</h1>
<p>27 itens + kit de avaliações pronto para usar</p>
<div class="brand">LK Digital</div>
</body>
</html>
